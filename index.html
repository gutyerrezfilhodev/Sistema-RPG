<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo de Fantasia - D&D 5e</title>
    <style>
        :root {
            --primary-color: #5c1d1d;
            --secondary-color: #2c2c2c;
            --bg-color: #f4f1ea;
            --card-bg: #fff;
            --border-color: #bfa15f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--secondary-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 95vh;
        }

        /* Tela Inicial */
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1600&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            border: 4px solid var(--primary-color);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 900px;
            margin: 0 auto;
        }

        .welcome-content {
            padding: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            border: 2px solid var(--border-color);
            max-width: 600px;
        }

        .welcome-content h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 20px;
            border-bottom: none;
        }

        .btn-start {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-start:hover {
            background-color: #431313;
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <div class="welcome-content">
            <h1>Bem Vindo a um Universo de Fantasia</h1>
            <button class="btn-start" onclick="iniciarCampanha()">Iniciar Campanha</button>
        </div>
    </div>

<script>
    function iniciarCampanha() {
        alert("Campanha iniciada!");
    }
</script>

</body>
</html>
