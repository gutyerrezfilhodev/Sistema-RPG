<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem - D&D 5e</title>
    <style>
        :root {
            --primary-color: #5c1d1d;
            --secondary-color: #2c2c2c;
            --bg-color: #f4f1ea;
            --card-bg: #fff;
            --border-color: #bfa15f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--secondary-color);
            margin: 0;
            padding: 20px;
        }

        .sheet-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 4px solid var(--primary-color);
            padding: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
            margin-top: 20px;
        }

        .header-section, .attributes-section, .combat-section, .inventory-section {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Cabeçalho do Personagem */
        .header-section {
            grid-template-columns: 150px 1fr;
            align-items: center;
        }

        .profile-pic-container {
            width: 150px;
            height: 150px;
            border: 2px dashed var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: #e9e5dc;
            border-radius: 4px;
        }

        .profile-pic-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-pic-container input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .header-fields {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
        }

        .field-group label {
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--primary-color);
        }

        .field-group input, .field-group select, textarea {
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            background: #fff;
        }

        /* Atributos Principais (For, Des, Con...) */
        .attributes-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            text-align: center;
        }

        .attribute-box {
            border: 2px solid var(--primary-color);
            border-radius: 6px;
            padding: 10px;
            background: #fdfbf7;
        }

        .attribute-box label {
            display: block;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--primary-color);
        }

        .attribute-box input.score {
            width: 50px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 5px 0;
        }

        .mod-box {
            font-size: 0.9rem;
            background: var(--border-color);
            color: #fff;
            padding: 2px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Seção de Combate */
        .combat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .combat-box {
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            background: #fdfbf7;
        }

        /* Inventário com Imagens */
        .inventory-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .item-card {
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            background: #fdfbf7;
            text-align: center;
            position: relative;
        }

        .item-img-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 10px auto;
            border: 1px dashed var(--primary-color);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

            width: 100%;
            height: 100
