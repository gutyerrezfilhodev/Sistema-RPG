<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem - D&D 5e</title>
    <style>
        :root {
            --primary-color: #5c1d1d;
            --secondary-color: #2c2c2c;
            --bg-color: #f4f1ea;
            --card-bg: #fff;
            --border-color: #bfa15f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--secondary-color);
            margin: 0;
            padding: 20px;
        }

        .sheet-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 4px solid var(--primary-color);
            padding: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
            margin-top: 20px;
        }

        .header-section, .attributes-section, .combat-section, .inventory-section {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Cabeçalho do Personagem */
        .header-section {
            grid-template-columns: 150px 1fr;
            align-items: center;
        }

        .profile-pic-container {
            width: 150px;
            height: 150px;
            border: 2px dashed var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: #e9e5dc;
            border-radius: 4px;
        }

        .profile-pic-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-pic-container input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .header-fields {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
        }

        .field-group label {
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--primary-color);
        }

        .field-group input, .field-group select, textarea {
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            background: #fff;
        }

        /* Atributos Principais (For, Des, Con...) */
        .attributes-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            text-align: center;
        }

        .attribute-box {
            border: 2px solid var(--primary-color);
            border-radius: 6px;
            padding: 10px;
            background: #fdfbf7;
        }

        .attribute-box label {
            display: block;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--primary-color);
        }

        .attribute-box input.score {
            width: 50px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 5px 0;
        }

        .mod-box {
            font-size: 0.9rem;
            background: var(--border-color);
            color: #fff;
            padding: 2px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Seção de Combate */
        .combat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .combat-box {
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            background: #fdfbf7;
        }

        /* Inventário com Imagens */
        .inventory-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .item-card {
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            background: #fdfbf7;
            text-align: center;
            position: relative;
        }

        .item-img-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 10px auto;
            border: 1px dashed var(--primary-color);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .item-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-img-container input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background-color: #431313;
        }

        .remove-btn {
            background-color: #a94442;
            padding: 2px 6px;
            font-size: 0.8rem;
            float: right;
        }
    </style>
</head>
<body>

<div class="sheet-container">
    <h1>Ficha de Personagem - D&D 5e</h1>

    <div class="header-section">
        <div class="profile-pic-container">
            <span id="profile-text" style="font-size: 0.8rem; text-align: center; color: #777;">Adicionar Foto</span>
            <img id="profile-preview" src="" alt="" style="display:none;">
            <input type="file" accept="image/*" onchange="carregarImagem(event, 'profile-preview', 'profile-text')">
        </div>
        <div class="header-fields">
            <div class="field-group">
                <label>Nome do Personagem</label>
                <input type="text">
            </div>
            <div class="field-group">
                <label>Classe e Nível</label>
                <input type="text">
            </div>
            <div class="field-group">
                <label>Antecedente</label>
                <input type="text">
            </div>
            <div class="field-group">
                <label>Nome do Jogador</label>
                <input type="text">
            </div>
            <div class="field-group">
                <label>Raça</label>
                <input type="text">
            </div>
            <div class="field-group">
                <label>Tendência</label>
                <input type="text">
            </div>
        </div>
    </div>

    <h2>Atributos</h2>
    <div class="attributes-grid">
        <div class="attribute-box">
            <label>FORÇA</label>
            <input type="number" class="score" oninput="calcularModificador(this)">
            <div class="mod-box">--</div>
        </div>
        <div class="attribute-box">
            <label>DESTREZA</label>
            <input type="number" class="score" oninput="calcularModificador(this)">
            <div class="mod-box">--</div>
        </div>
        <div class="attribute-box">
            <label>CONSTITUIÇÃO</label>
            <input type="number" class="score" oninput="calcularModificador(this)">
            <div class="mod-box">--</div>
        </div>
        <div class="attribute-box">
            <label>INTELIGÊNCIA</label>
            <input type="number" class="score" oninput="calcularModificador(this)">
            <div class="mod-box">--</div>
        </div>
        <div class="attribute-box">
            <label>SABEDORIA</label>
            <input type="number" class="score" oninput="calcularModificador(this)">
            <div class="mod-box">--</div>
        </div>
        <div class="attribute-box">
            <label>CARISMA</label>
            <input type="number" class="score" oninput="calcularModificador(this)">
            <div class="mod-box">--</div>
        </div>
    </div>

    <h2>Combate</h2>
    <div class="combat-grid">
        <div class="combat-box">
            <label style="font-weight:bold; color:var(--primary-color);">Classe de Armadura (CA)</label>
            <input type="number" style="width: 60px; text-align: center; font-size: 1.2rem; margin-top:5px;">
        </div>
        <div class="combat-box">
            <label style="font-weight:bold; color:var(--primary-color);">Iniciativa</label>
            <input type="number" style="width: 60px; text-align: center; font-size: 1.2rem; margin-top:5px;">
        </div>
        <div class="combat-box">
            <label style="font-weight:bold; color:var(--primary-color);">Deslocamento</label>
            <input type="text" style="width: 60px; text-align: center; font-size: 1.2rem; margin-top:5px;">
        </div>
    </div>

    <h2>Inventário & Tesouro</h2>
    <div class="inventory-section">
        <div id="inventory-container" class="inventory-list">
            <div class="item-card">
                <button class="remove-btn" onclick="removerItem(this)">X</button>
                <div class="item-img-container">
                    <span style="font-size: 0.7rem; color: #777;">Foto Item</span>
                    <input type="file" accept="image/*" onchange="carregarImagemItem(event, this)">
                </div>
                <input type="text" placeholder="Nome do Item" style="width: 90%; margin-bottom: 5px;">
                <input type="text" placeholder="Qtd / Peso" style="width: 90%;">
            </div>
        </div>
        <button onclick="adicionarItem()">+ Adicionar Novo Item</button>
    </div>

</div>

<script>
    function carregarImagem(event, previewId, textId) {
        const reader = new FileReader();
        reader.onload = function() {
            const output = document.getElementById(previewId);
            output.src = reader.result;
            output.style.display = 'block';
            document.getElementById(textId).style.display = 'none';
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    function calcularModificador(inputElement) {
        const modBox = inputElement.parentElement.querySelector('.mod-box');
        const val = inputElement.value.trim();
        
        if (val === '') {
            modBox.textContent = '--';
            return;
        }

        const score = parseInt(val);
        if (isNaN(score)) {
            modBox.textContent = '--';
            return;
        }

        const mod = Math.floor((score - 10) / 2);
        modBox.textContent = (mod >= 0 ? '+' : '') + mod;
    }

    function carregarImagemItem(event, inputElement) {
        const reader = new FileReader();
        const container = inputElement.parentElement;
        
        reader.onload = function() {
            let img = container.querySelector('img');
            if (!img) {
                img = document.createElement('img');
                container.appendChild(img);
            }
            img.src = reader.result;
            const span = container.querySelector('span');
            if (span) span.style.display = 'none';
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    function adicionarItem() {
        const container = document.getElementById('inventory-container');
        const itemCard = document.createElement('div');
        itemCard.className = 'item-card';
        itemCard.innerHTML = `
            <button class="remove-btn" onclick="removerItem(this)">X</button>
            <div class="item-img-container">
                <span style="font-size: 0.7rem; color: #777;">Foto Item</span>
                <input type="file" accept="image/*" onchange="carregarImagemItem(event, this)">
            </div>
            <input type="text" placeholder="Nome do Item" style="width: 90%; margin-bottom: 5px;">
            <input type="text" placeholder="Qtd / Peso" style="width: 90%;">
        `;
        container.appendChild(itemCard);
    }

    function removerItem(button) {
        button.parentElement.remove();
    }
</script>

</body>
</html>
