<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Campanha</title>
    <style>
        :root {
            --primary-color: #5c1d1d;
            --secondary-color: #2c2c2c;
            --bg-color: #f4f1ea;
            --card-bg: #fff;
            --border-color: #bfa15f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--secondary-color);
            margin: 0;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 4px solid var(--primary-color);
            padding: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 8px;
            min-height: 80vh;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .nav-header h2 {
            color: var(--primary-color);
            margin: 0;
        }

        .btn-voltar {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-voltar:hover {
            background-color: #1a1a1a;
        }

        /* Abas de Navegação */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            background-color: #e9e5dc;
            color: var(--secondary-color);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .tab-btn:hover:not(.active) {
            background-color: #dcd6cb;
        }

        /* Conteúdo das Abas */
        .tab-content {
            display: none;
            padding: 20px;
            background: #fdfbf7;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            min-height: 300px;
        }

        .tab-content.active {
            display: block;
        }

        .tab-content h3 {
            color: var(--primary-color);
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="nav-header">
            <h2>Painel da Campanha</h2>
            <a href="index.html" class="btn-voltar">← Voltar ao Início</a>
        </div>

        <!-- Botões das Abas -->
        <div class="tabs">
            <button class="tab-btn active" onclick="mudarAba(event, 'personagens')">Personagens</button>
            <button class="tab-btn" onclick="mudarAba(event, 'inimigos')">Inimigos</button>
            <button class="tab-btn" onclick="mudarAba(event, 'itens')">Itens</button>
            <button class="tab-btn" onclick="mudarAba(event, 'cenario')">Cenário</button>
        </div>

        <!-- Conteúdo: Personagens -->
        <div id="personagens" class="tab-content active">
            <h3>Personagens</h3>
            <p>Gerencie os personagens da campanha aqui...</p>
        </div>

        <!-- Conteúdo: Inimigos -->
        <div id="inimigos" class="tab-content">
            <h3>Inimigos</h3>
            <p>Gerencie as criaturas e vilões aqui...</p>
        </div>

        <!-- Conteúdo: Itens -->
        <div id="itens" class="tab-content">
            <h3>Itens</h3>
            <p>Gerencie os equipamentos, artefatos e tesouros aqui...</p>
        </div>

        <!-- Conteúdo: Cenário -->
        <div id="cenario" class="tab-content">
            <h3>Cenário</h3>
            <p>Gerencie as localizações, mapas e história do mundo aqui...</p>
        </div>
    </div>

    <script>
        function mudarAba(event, abaId) {
            // Esconde todo o conteúdo das abas
            const conteudos = document.querySelectorAll('.tab-content');
            conteudos.forEach(conteudo => conteudo.classList.remove('active'));

            // Remove a classe active de todos os botões
            const botoes = document.querySelectorAll('.tab-btn');
            botoes.forEach(botao => botao.classList.remove('active'));

            // Mostra a aba clicada e ativa o botão correspondente
            document.getElementById(abaId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>

</body>
</html>
